global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tradeflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8000
          - user-service:8081
          - market-data-service:8083
          - order-service:8080
          - portfolio-service:8082
          - learning-service:8084
          - live-trading-service:8086
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
