groups:
  - name: tradeflow
    rules:
      - alert: ServiceDown
        expr: up{job="tradeflow"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.service }} is not responding to metric scrapes" }
      - alert: HighErrorRate
        expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.service }} is returning server errors" }
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le, service) (rate(http_server_requests_seconds_bucket{uri!~".*stream.*"}[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.service }} p95 latency is above 2 seconds" }
      - alert: HeapNearLimit
        expr: sum by (service) (jvm_memory_used_bytes{area="heap"}) / sum by (service) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.service }} heap is above 90%" }
