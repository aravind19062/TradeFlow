spring.application.name=tradeflow-api-gateway
server.port=${SERVER_PORT:8000}

# ---------------------------------------------------------------------------
# Routing: lb://<service-name> resolves instances from Eureka and load-balances
# across them (Spring Cloud LoadBalancer, round robin). Each route has a circuit
# breaker that answers 503 via /fallback/<service> when the service is unavailable.
# /internal/** is never routed (and denied by GatewaySecurityConfig).
# ---------------------------------------------------------------------------
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://tradeflow-user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/admin/users/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=user-service
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/user-service

spring.cloud.gateway.server.webmvc.routes[1].id=market-data-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://tradeflow-market-data-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/market/**,/api/watchlist/**,/api/alerts/**,/api/admin/market/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.id=market-data-service
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/market-data-service

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://tradeflow-order-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/orders/**,/api/trades/**,/api/admin/orders/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.id=order-service
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.fallbackUri=forward:/fallback/order-service

spring.cloud.gateway.server.webmvc.routes[3].id=portfolio-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://tradeflow-portfolio-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/portfolio/**,/api/assistant/**,/api/admin/portfolio/**,/api/admin/reconciliation/**,/api/admin/reconciliation
spring.cloud.gateway.server.webmvc.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.id=portfolio-service
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.fallbackUri=forward:/fallback/portfolio-service

# OpenAPI documents of each service, for the aggregated Swagger UI below.
spring.cloud.gateway.server.webmvc.routes[4].id=docs-user
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://tradeflow-user-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/v3/api-docs/user
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[5].id=docs-market
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://tradeflow-market-data-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/v3/api-docs/market-data
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[6].id=docs-order
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://tradeflow-order-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/v3/api-docs/order
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[7].id=docs-portfolio
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://tradeflow-portfolio-service
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/v3/api-docs/portfolio
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=SetPath=/v3/api-docs

springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/user
springdoc.swagger-ui.urls[1].name=market-data-service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/market-data
springdoc.swagger-ui.urls[2].name=order-service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/order
springdoc.swagger-ui.urls[3].name=portfolio-service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/portfolio

# Downstream timeouts: connect fast, give the slowest endpoint (AI assistant) room.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=65s
# Circuit breakers: open after 50% failures in the last 20 calls (min 10), probe after 15s.
# Calls run on the request thread (no time limiter thread hop); the read timeout bounds them.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
# No thread pool either: breaker-protected calls run on the request thread, so the
# caller's security context (JWT relay) and MDC request id are preserved
# (verified by FeignTokenRelayTest: with a thread pool the relayed token is lost).
spring.cloud.circuitbreaker.resilience4j.disable-thread-pool=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s

# Discovery. The gateway's load balancer skips instances whose readiness check fails.
spring.cloud.loadbalancer.health-check.path.default=/actuator/health/readiness
spring.cloud.loadbalancer.health-check.interval=10s
spring.cloud.loadbalancer.health-check.refetch-instances=true
spring.cloud.loadbalancer.health-check.refetch-instances-interval=10s
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Security: same HS256 secret and issuer as the services; see GatewaySecurityConfig.
tradeflow.security.jwt.secret=${TRADEFLOW_JWT_SECRET:}
tradeflow.security.jwt.issuer=tradeflow-user-service

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
