spring.application.name=tradeflow-discovery-server
server.port=${SERVER_PORT:8761}

# This is the registry itself: it does not register with or fetch from another registry.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Local single-node setup: evict instances that stop heart-beating quickly instead of
# keeping them ("self-preservation" exists for network partitions in large clusters).
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-update-interval-ms=3000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
