# No-Docker fallback: file-based H2 in PostgreSQL compatibility mode.
# Data survives restarts in ${TRADEFLOW_H2_DIR:~/.tradeflow/h2}. Delete that folder to reset.
# H2 is a convenience; it is not evidence of PostgreSQL compatibility.
spring.datasource.url=jdbc:h2:file:${TRADEFLOW_H2_DIR:${user.home}/.tradeflow/h2}/tradeflow_order;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
