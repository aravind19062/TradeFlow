name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Unit, H2, embedded-Kafka and in-JVM end-to-end tests, plus PostgreSQL
      # compatibility tests (Testcontainers: GitHub runners have Docker).
      - name: Build and test
        run: mvn -B verify -Ppostgres-tests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile apps config --quiet
      - name: Build service images
        run: |
          for s in user-service market-data-service order-service portfolio-service; do
            docker build -f docker/service.Dockerfile --build-arg SERVICE=$s -t tradeflow/$s:ci .
          done
