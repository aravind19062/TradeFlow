# In-memory H2 for fast tests. PostgreSQL behaviour is covered by *PostgresIT tests.
spring.datasource.url=jdbc:h2:mem:tradeflow_live-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Tests that need Kafka use @EmbeddedKafka, which sets spring.embedded.kafka.brokers.
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:65535}
spring.kafka.admin.auto-create=${tradeflow.test.kafka:false}
spring.kafka.listener.auto-startup=${tradeflow.test.kafka:false}
tradeflow.outbox.publisher-enabled=${tradeflow.test.kafka:false}
tradeflow.kafka.retry.interval-ms=100
tradeflow.kafka.retry.max-attempts=1
tradeflow.security.jwt.public-keys=classpath*:jwt-test/public/*.pem
eureka.client.enabled=false
tradeflow.loadbalancer.readiness-checks=false
tradeflow.crypto.keyring=classpath:crypto-test/data-keys.properties
tradeflow.security.jwt.audience=tradeflow,tradeflow-live
