spring.application.name=tradeflow-live-trading-service

# LIVE: real broker accounts and real money. Never accepts DEMO events (enforced by EventCodec).
tradeflow.environment=LIVE
tradeflow.events.accepted-environments=LIVE,PLATFORM
spring.profiles.group.h2=local
server.forward-headers-strategy=native
server.port=${SERVER_PORT:8086}

spring.datasource.url=jdbc:postgresql://localhost:5432/tradeflow_live
spring.datasource.username=${TRADEFLOW_DB_USERNAME:tradeflow}
spring.datasource.password=${TRADEFLOW_DB_PASSWORD:tradeflow}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/live,classpath:db/migration/live-{vendor}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.admin.fail-fast=false

# ---------------------------------------------------------------------------
# Security: RS256 tokens from user-service. Reads accept ordinary access tokens; every
# state-changing live action additionally requires a step-up token (audience tradeflow-live,
# password + TOTP, at most 10 minutes old), checked by LiveAccessGuard.
# ---------------------------------------------------------------------------
tradeflow.security.jwt.public-keys=${TRADEFLOW_JWT_PUBLIC_KEYS:}
tradeflow.security.jwt.issuer=tradeflow-user-service
tradeflow.security.jwt.audience=tradeflow,tradeflow-live
# Client secret for SERVICE tokens (eligibility and session checks).
tradeflow.security.service-client.secret=${TRADEFLOW_SERVICE_SECRET_LIVE:}
# AES-256-GCM key ring for broker credentials at rest (separate from user-service's keys).
tradeflow.crypto.keyring=${TRADEFLOW_LIVE_DATA_KEYRING:}

# ---------------------------------------------------------------------------
# Live trading controls. Platform limits are ceilings: users can only make them stricter.
# Broker: "none" (DisabledBrokerAdapter refuses everything) or "fyers" (read-only in phase 6:
# account data and the order book; orders are refused). Fyers app credentials come from the
# environment only; the secret is never committed. Redirect URI = the app's registered URL.
# ---------------------------------------------------------------------------
tradeflow.live.broker=${TRADEFLOW_LIVE_BROKER:none}
tradeflow.live.fyers.app-id=${TRADEFLOW_FYERS_APP_ID:}
tradeflow.live.fyers.secret-key=${TRADEFLOW_FYERS_SECRET_KEY:}
tradeflow.live.fyers.redirect-uri=${TRADEFLOW_FYERS_REDIRECT_URI:http://localhost:3000/live/broker/callback}
tradeflow.live.platform-max-order-value=${TRADEFLOW_LIVE_MAX_ORDER_VALUE:25000}
tradeflow.live.platform-max-orders-per-day=${TRADEFLOW_LIVE_MAX_ORDERS_PER_DAY:10}
tradeflow.live.platform-max-daily-turnover=${TRADEFLOW_LIVE_MAX_DAILY_TURNOVER:100000}
tradeflow.live.confirmation-ttl=PT60S
tradeflow.live.step-up-max-age=PT10M

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{requestId:-}%X{eventId:-}]
tradeflow.admin.path=/api/admin/live

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
spring.cloud.loadbalancer.health-check.path.default=/actuator/health/readiness
# Re-read the instance list: without this a restarted learning-/user-service (new instance) is never
# picked up again and every live safety check fails closed until this service restarts.
spring.cloud.loadbalancer.health-check.interval=10s
spring.cloud.loadbalancer.health-check.refetch-instances=true
spring.cloud.loadbalancer.health-check.refetch-instances-interval=10s
