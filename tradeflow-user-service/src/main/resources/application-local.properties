# LOCAL DEVELOPMENT ONLY (activated explicitly with SPRING_PROFILES_ACTIVE=local,
# automatically by the 'h2' profile, and by docker-compose for the local stack).
# Never activate this profile on a shared or internet-facing environment.
# Keys are generated per machine by `make keys` (or the Docker keygen container) under .secrets/,
# which is git-ignored. Docker overrides these locations with mounted volumes.
tradeflow.security.jwt.public-keys=${TRADEFLOW_JWT_PUBLIC_KEYS:file:.secrets/jwt/public/*.pem}
tradeflow.security.auth.signing-key=${TRADEFLOW_JWT_SIGNING_KEY:file:.secrets/jwt/private/signing-key.pem}
tradeflow.crypto.keyring=${TRADEFLOW_DATA_KEYRING:file:.secrets/user-service/data-keys.properties}
# Public placeholder client secrets: accepted only under this profile.
tradeflow.security.auth.service-clients.tradeflow-portfolio-service=${TRADEFLOW_SERVICE_SECRET_PORTFOLIO:local-dev-only-portfolio-client-secret}
tradeflow.security.auth.service-clients.tradeflow-live-trading-service=${TRADEFLOW_SERVICE_SECRET_LIVE:local-dev-only-live-trading-client-secret}
# Plain http on localhost.
tradeflow.security.auth.cookie-secure=${TRADEFLOW_COOKIE_SECURE:false}

# DEMO DATA: demo@tradeflow.dev (USER) and admin@tradeflow.dev (ADMIN) with a public password.
tradeflow.demo.enabled=${TRADEFLOW_DEMO_ENABLED:true}
tradeflow.demo.password=${TRADEFLOW_DEMO_PASSWORD:Demo@12345}
