# TradeFlow local environment.
#
#   make infra-up     PostgreSQL + Kafka only (run the services from your IDE / mvn)
#   make up           infrastructure + Eureka + API gateway + all services + web frontend
#   make tools        Kafka UI on http://localhost:8085 (optional, ~230 MB)
#   make down         stop everything, KEEP data volumes
#   make reset        stop everything and DELETE the PostgreSQL and Kafka volumes (asks first)
#
# Networking: containers reach each other by service name (postgres:5432,
# kafka:29092, discovery-server:8761). Services find each other through Eureka.
# From your Mac: web app http://localhost:3000 (nginx; proxies /api to the gateway),
# API gateway http://localhost:8000 (the ONLY API entry point; the
# services publish no host ports, so the gateway cannot be bypassed), Eureka
# dashboard http://localhost:8761, PostgreSQL localhost:5432, Kafka localhost:9094
# (9094 so it never collides with a Homebrew Kafka on 9092).
#
# Memory: every container has a limit so the whole stack fits in a ~4 GiB Docker VM
# (services 576m each incl. 2 market-data replicas, learning and live-trading 512m each,
# gateway 448m, Eureka 384m, Kafka 900m, PostgreSQL 256m, frontend 64m; see D8 in
# docs/DUAL_MODE_TRADING.md: 6 GiB minimum / 8 GiB recommended for the full stack). Limits are ceilings; typical use is well below them.

name: tradeflow

x-service-env: &service-env
  # Local stack: explicit 'local' profile (public demo credentials and placeholder service
  # client secrets are only accepted under this profile).
  SPRING_PROFILES_ACTIVE: local
  EUREKA_URL: http://discovery-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  TRADEFLOW_DB_USERNAME: ${POSTGRES_USER:-tradeflow}
  TRADEFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:-tradeflow}
  # RS256: every service verifies tokens with user-service's public key (generated by `keygen`).
  TRADEFLOW_JWT_PUBLIC_KEYS: file:/run/tradeflow/jwt-public/*.pem
  # Heap = 65% of the container limit below; Serial GC has the smallest footprint.
  JAVA_OPTS: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m

x-service-depends: &service-depends
  keygen:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  discovery-server:
    condition: service_healthy

services:

  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the volume is empty: creates one database per service.
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    mem_limit: 900m
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"          # any 22-char base64 UUID; fixed for reproducibility
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: other containers. EXTERNAL: your Mac. CONTROLLER: KRaft quorum.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    # Kafka data lives on a named volume. Wiping it while services keep running would
    # let a fresh broker hand out producer ids still used by those services, and the
    # broker then acknowledges some writes as "duplicates" without storing them. With
    # the volume, recreating the kafka container keeps its log and producer state;
    # `make reset` removes it only together with every client.
    volumes:
      - kafka_data:/var/lib/kafka/data
    # The image also declares these VOLUMEs; empty tmpfs mounts stop Docker from
    # leaving orphaned anonymous volumes behind on every down/up cycle.
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    healthcheck:
      # The check starts a small JVM; cap its heap so it doesn't spike memory every interval.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: ["tools"]
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tradeflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: -Xmx192m -XX:+UseSerialGC

  # ---------------------------------------------------------------- services
  # Started only with the "apps" profile: `make up` or `docker compose --profile apps up`.

  # One-shot: creates per-installation keys on first start, never overwrites them.
  # Separate volumes so each service mounts only what it needs: the token SIGNING key and the
  # user data-encryption keys go to user-service alone, the live data keys (broker tokens) to
  # live-trading-service alone; the public key goes to everyone.
  keygen:
    profiles: ["apps"]
    image: eclipse-temurin:17.0.18_8-jre-noble
    entrypoint: ["sh", "/keygen.sh", "/keys/jwt-private", "/keys/jwt-public", "/keys/user-data", "10001", "/keys/live-data"]
    volumes:
      - ./docker/keygen.sh:/keygen.sh:ro
      - jwt_private:/keys/jwt-private
      - jwt_public:/keys/jwt-public
      - user_data_keys:/keys/user-data
      - live_data_keys:/keys/live-data
    mem_limit: 64m

  # One-shot: creates databases added after the PostgreSQL volume was first initialised
  # (init-db.sql only runs on an empty volume). Idempotent; never drops anything.
  db-init:
    profiles: ["apps"]
    image: postgres:16.14-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-tradeflow}
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow}
    entrypoint: ["sh", "-c"]
    command:
      - 'for db in tradeflow_learning tradeflow_live; do psql -h postgres -U "$$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = ''$$db''" | grep -q 1 || psql -h postgres -U "$$POSTGRES_USER" -d postgres -c "CREATE DATABASE $$db" || exit 1; done'
    mem_limit: 64m

  discovery-server:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: discovery-server } }
    image: tradeflow/discovery-server:local
    mem_limit: 384m
    ports: ["8761:8761"]
    environment:
      SERVER_PORT: "8761"
      JAVA_OPTS: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m
    healthcheck: &app-health
      test: ["CMD-SHELL", "curl -fs http://localhost:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-gateway:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: api-gateway } }
    image: tradeflow/api-gateway:local
    mem_limit: 448m
    depends_on:
      keygen:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
    environment:
      SERVER_PORT: "8000"
      SPRING_PROFILES_ACTIVE: local
      EUREKA_URL: http://discovery-server:8761/eureka
      TRADEFLOW_JWT_PUBLIC_KEYS: file:/run/tradeflow/jwt-public/*.pem
      JAVA_OPTS: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m
    healthcheck: *app-health

  frontend:
    profiles: ["apps"]
    build: { context: ./tradeflow-frontend }
    image: tradeflow/frontend:local
    mem_limit: 64m
    depends_on:
      api-gateway:
        condition: service_healthy
    # Static React app + reverse proxy: the browser calls /api on this origin and nginx
    # forwards to api-gateway:8000 on the compose network (no CORS, no service ports).
    ports: ["3000:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  user-service:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: user-service } }
    image: tradeflow/user-service:local
    mem_limit: 576m
    depends_on: *service-depends
    volumes:
      - jwt_private:/run/tradeflow/jwt-private:ro
      - jwt_public:/run/tradeflow/jwt-public:ro
      - user_data_keys:/run/tradeflow/data-keys:ro
    environment:
      <<: *service-env
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_user
      TRADEFLOW_JWT_SIGNING_KEY: file:/run/tradeflow/jwt-private/signing-key.pem
      TRADEFLOW_DATA_KEYRING: file:/run/tradeflow/data-keys/data-keys.properties
      TRADEFLOW_SERVICE_SECRET_PORTFOLIO: ${TRADEFLOW_SERVICE_SECRET_PORTFOLIO:-local-dev-only-portfolio-client-secret}
      TRADEFLOW_SERVICE_SECRET_LIVE: ${TRADEFLOW_SERVICE_SECRET_LIVE:-local-dev-only-live-trading-client-secret}
      TRADEFLOW_DEMO_ENABLED: ${TRADEFLOW_DEMO_ENABLED:-true}
      TRADEFLOW_DEMO_PASSWORD: ${TRADEFLOW_DEMO_PASSWORD:-Demo@12345}
    healthcheck: *app-health

  market-data-service:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: market-data-service } }
    image: tradeflow/market-data-service:local
    mem_limit: 576m
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
    # Two replicas to demonstrate load balancing (gateway and Feign calls alternate between
    # them; see X-Served-By). Safe: outbox rows are claimed with SKIP LOCKED and only one
    # simulated tick is generated per interval across replicas.
    deploy:
      replicas: 2
    depends_on: *service-depends
    environment:
      <<: *service-env
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_market_data
      TRADEFLOW_MARKET_TICK_MS: ${TRADEFLOW_MARKET_TICK_MS:-30000}
    healthcheck: *app-health

  order-service:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: order-service } }
    image: tradeflow/order-service:local
    mem_limit: 576m
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
    depends_on:
      <<: *service-depends
      market-data-service:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_order
    healthcheck: *app-health

  portfolio-service:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: portfolio-service } }
    image: tradeflow/portfolio-service:local
    mem_limit: 576m
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
    depends_on:
      <<: *service-depends
      market-data-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_portfolio
      TRADEFLOW_SERVICE_SECRET_PORTFOLIO: ${TRADEFLOW_SERVICE_SECRET_PORTFOLIO:-local-dev-only-portfolio-client-secret}
      TRADEFLOW_AI_PROVIDER: ${TRADEFLOW_AI_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck: *app-health

  learning-service:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: learning-service } }
    image: tradeflow/learning-service:local
    mem_limit: 512m
    depends_on:
      <<: *service-depends
      db-init:
        condition: service_completed_successfully
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
    environment:
      <<: *service-env
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_learning
    healthcheck: *app-health

  # LIVE trading (real money). Own database and own encryption keys. No broker is integrated:
  # TRADEFLOW_LIVE_BROKER must stay "none" (any other value refuses to start).
  live-trading-service:
    profiles: ["apps"]
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: live-trading-service } }
    image: tradeflow/live-trading-service:local
    mem_limit: 512m
    depends_on:
      <<: *service-depends
      db-init:
        condition: service_completed_successfully
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
      - live_data_keys:/run/tradeflow/data-keys:ro
    environment:
      <<: *service-env
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_live
      TRADEFLOW_LIVE_DATA_KEYRING: file:/run/tradeflow/data-keys/data-keys.properties
      TRADEFLOW_SERVICE_SECRET_LIVE: ${TRADEFLOW_SERVICE_SECRET_LIVE:-local-dev-only-live-trading-client-secret}
      TRADEFLOW_LIVE_BROKER: none
    healthcheck: *app-health

volumes:
  postgres_data:
  kafka_data:
  # Key material (see keygen). Deleting jwt_private/jwt_public signs everyone out;
  # deleting user_data_keys makes stored TOTP seeds unreadable (users must re-enrol);
  # deleting live_data_keys makes stored broker tokens unreadable (users must reconnect).
  jwt_private:
  jwt_public:
  user_data_keys:
  live_data_keys:
