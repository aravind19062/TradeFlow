# TradeFlow local environment.
#
#   make infra-up     PostgreSQL + Kafka only (run the services from your IDE / mvn)
#   make up           infrastructure + Eureka + API gateway + all services + web frontend
#   make tools        Kafka UI on http://localhost:8085 (optional, ~230 MB)
#   make down         stop everything, KEEP data volumes
#   make reset        stop everything and DELETE the PostgreSQL and Kafka volumes (asks first)
#
# Networking: containers reach each other by service name (postgres:5432,
# kafka:29092, discovery-server:8761). Services find each other through Eureka.
# From your Mac: web app http://localhost:3000 (nginx; proxies /api to the gateway),
# API gateway http://localhost:8000 (the ONLY API entry point; the
# services publish no host ports, so the gateway cannot be bypassed), Eureka
# dashboard http://localhost:8761, PostgreSQL localhost:5432, Kafka localhost:9094
# (9094 so it never collides with a Homebrew Kafka on 9092).
#
# Memory: tuned so the full stack runs in a 4 GiB Docker VM (docs/DEVELOPMENT_RESOURCES.md has
# the measurements). Every JVM gets an explicit heap cap, C1-only JIT, Serial GC that hands
# freed heap back, and at most two malloc arenas; Kafka and PostgreSQL are trimmed for a
# single-user dev machine. Limits are ceilings, typical use is well below them.
# Start only what you need:  make up-demo (demo trading), make up-academy (+ learning),
# make up (everything incl. live). One market-data replica by default; MARKET_DATA_REPLICAS=2
# shows the load balancing.

name: tradeflow

# Measured (docs/DEVELOPMENT_RESOURCES.md): ~135 MB metaspace and 60-110 MB heap per service.
# C1-only JIT (TieredStopAtLevel=1) drops the C2 compiler threads and their arenas and roughly
# halves the code cache; MaxHeapFreeRatio lets Serial GC shrink the heap after a burst.
# Development settings: peak throughput is lower than with C2, which a laptop stack never needs.
x-jvm-base: &jvm-base >-
  -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=64m
  -XX:MaxMetaspaceSize=192m -Xss512k -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30
  -XX:+ExitOnOutOfMemoryError

x-service-env: &service-env
  # Local stack: explicit 'local' profile (public demo credentials and placeholder service
  # client secrets are only accepted under this profile).
  SPRING_PROFILES_ACTIVE: local
  EUREKA_URL: http://discovery-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  TRADEFLOW_DB_USERNAME: ${POSTGRES_USER:-tradeflow}
  TRADEFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:-tradeflow}
  # RS256: every service verifies tokens with user-service's public key (generated by `keygen`).
  TRADEFLOW_JWT_PUBLIC_KEYS: file:/run/tradeflow/jwt-public/*.pem
  # Shared JVM flags (see x-jvm-base); JAVA_OPTS only carries each service's heap cap.
  JAVA_TOOL_OPTIONS: *jvm-base
  MALLOC_ARENA_MAX: "2"
  JAVA_OPTS: -Xmx160m
  # 5 connections per service is plenty for one developer and keeps PostgreSQL small.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

x-service-depends: &service-depends
  keygen:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  discovery-server:
    condition: service_healthy

services:

  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    mem_limit: 256m
    # Small shared buffers for a dev data set; connections are capped by each service's pool
    # (local profile: 5 per service).
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=60", "-c", "work_mem=2MB"]
    shm_size: 64m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the volume is empty: creates one database per service.
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"          # any 22-char base64 UUID; fixed for reproducibility
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: other containers. EXTERNAL: your Mac. CONTROLLER: KRaft quorum.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Single broker, a handful of small topics: a 256 MB heap is ample. The image's default
      # JVM flags use G1 tuned for throughput; Serial GC + C1 is far smaller. These env vars
      # also apply to the health check's short-lived JVM.
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=128m -Djava.awt.headless=true
      MALLOC_ARENA_MAX: "2"
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      # The compaction dedupe buffer defaults to 128 MB of heap; __consumer_offsets is tiny here.
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 16777216
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    # Kafka data lives on a named volume. Wiping it while services keep running would
    # let a fresh broker hand out producer ids still used by those services, and the
    # broker then acknowledges some writes as "duplicates" without storing them. With
    # the volume, recreating the kafka container keeps its log and producer state;
    # `make reset` removes it only together with every client.
    volumes:
      - kafka_data:/var/lib/kafka/data
    # The image also declares these VOLUMEs; empty tmpfs mounts stop Docker from
    # leaving orphaned anonymous volumes behind on every down/up cycle.
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    healthcheck:
      # The check starts a small JVM; cap its heap so it doesn't spike memory every interval.
      # Every check starts a JVM (~80 MB for a few seconds), so probe often only while starting.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s
      start_interval: 5s

  # Metrics and dashboards (make obs-up). Meant for the server: about 250 MB extra, so leave it off
  # on the 8 GB Mac unless you are looking at it. Both listen on this machine only.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=1GB"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 192m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    depends_on: [prometheus]
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 192m
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: ["tools"]
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tradeflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: -Xmx192m -XX:+UseSerialGC

  # ---------------------------------------------------------------- services
  # Profiles pick how much starts (infrastructure always starts):
  #   demo     Eureka, gateway, frontend, user, market-data, order, portfolio   (make up-demo)
  #   academy  demo + learning-service                                          (make up-academy)
  #   apps     everything, including live-trading-service                       (make up)
  # Live trading needs learning-service (eligibility) and refuses actions without it.

  # One-shot: creates per-installation keys on first start, never overwrites them.
  # Separate volumes so each service mounts only what it needs: the token SIGNING key and the
  # user data-encryption keys go to user-service alone, the live data keys (broker tokens) to
  # live-trading-service alone; the public key goes to everyone.
  keygen:
    profiles: ["apps", "demo", "academy"]
    image: eclipse-temurin:17.0.18_8-jre-noble
    entrypoint: ["sh", "/keygen.sh", "/keys/jwt-private", "/keys/jwt-public", "/keys/user-data", "10001", "/keys/live-data"]
    volumes:
      - ./docker/keygen.sh:/keygen.sh:ro
      - jwt_private:/keys/jwt-private
      - jwt_public:/keys/jwt-public
      - user_data_keys:/keys/user-data
      - live_data_keys:/keys/live-data
    mem_limit: 64m

  # One-shot: creates databases added after the PostgreSQL volume was first initialised
  # (init-db.sql only runs on an empty volume). Idempotent; never drops anything.
  db-init:
    profiles: ["apps", "academy"]
    image: postgres:16.14-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-tradeflow}
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow}
    entrypoint: ["sh", "-c"]
    command:
      - 'for db in tradeflow_learning tradeflow_live; do psql -h postgres -U "$$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = ''$$db''" | grep -q 1 || psql -h postgres -U "$$POSTGRES_USER" -d postgres -c "CREATE DATABASE $$db" || exit 1; done'
    mem_limit: 64m

  discovery-server:
    profiles: ["apps", "demo", "academy"]
    # Come back after a Docker Desktop restart, and give Spring time to finish in-flight
    # work and leave its Kafka groups before Docker escalates SIGTERM to SIGKILL (exit 137).
    restart: unless-stopped
    stop_grace_period: 30s
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: discovery-server } }
    image: tradeflow/discovery-server:local
    mem_limit: 320m
    ports: ["8761:8761"]
    environment:
      SERVER_PORT: "8761"
      JAVA_TOOL_OPTIONS: *jvm-base
      MALLOC_ARENA_MAX: "2"
      JAVA_OPTS: -Xmx96m
    healthcheck: &app-health
      test: ["CMD-SHELL", "curl -fs http://localhost:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-gateway:
    profiles: ["apps", "demo", "academy"]
    # Come back after a Docker Desktop restart, and give Spring time to finish in-flight
    # work and leave its Kafka groups before Docker escalates SIGTERM to SIGKILL (exit 137).
    restart: unless-stopped
    stop_grace_period: 30s
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: api-gateway } }
    image: tradeflow/api-gateway:local
    mem_limit: 384m
    depends_on:
      keygen:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
    environment:
      SERVER_PORT: "8000"
      SPRING_PROFILES_ACTIVE: local
      EUREKA_URL: http://discovery-server:8761/eureka
      TRADEFLOW_JWT_PUBLIC_KEYS: file:/run/tradeflow/jwt-public/*.pem
      JAVA_TOOL_OPTIONS: *jvm-base
      MALLOC_ARENA_MAX: "2"
      # Netty buffers live outside the heap; cap them so a burst can't grow without bound.
      JAVA_OPTS: -Xmx128m -XX:MaxDirectMemorySize=64m
    healthcheck: *app-health

  frontend:
    profiles: ["apps", "demo", "academy"]
    restart: unless-stopped
    build: { context: ./tradeflow-frontend }
    image: tradeflow/frontend:local
    mem_limit: 64m
    depends_on:
      api-gateway:
        condition: service_healthy
    # Static React app + reverse proxy: the browser calls /api on this origin and nginx
    # forwards to api-gateway:8000 on the compose network (no CORS, no service ports).
    ports: ["3000:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  user-service:
    profiles: ["apps", "demo", "academy"]
    # Come back after a Docker Desktop restart, and give Spring time to finish in-flight
    # work and leave its Kafka groups before Docker escalates SIGTERM to SIGKILL (exit 137).
    restart: unless-stopped
    stop_grace_period: 30s
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: user-service } }
    image: tradeflow/user-service:local
    mem_limit: 448m
    depends_on: *service-depends
    volumes:
      - jwt_private:/run/tradeflow/jwt-private:ro
      - jwt_public:/run/tradeflow/jwt-public:ro
      - user_data_keys:/run/tradeflow/data-keys:ro
    environment:
      <<: *service-env
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_user
      TRADEFLOW_JWT_SIGNING_KEY: file:/run/tradeflow/jwt-private/signing-key.pem
      TRADEFLOW_DATA_KEYRING: file:/run/tradeflow/data-keys/data-keys.properties
      TRADEFLOW_PASSKEY_RP_ID: ${TRADEFLOW_PASSKEY_RP_ID:-localhost}
      TRADEFLOW_PASSKEY_ORIGINS: ${TRADEFLOW_PASSKEY_ORIGINS:-http://localhost:3000,http://localhost:5173}
      TRADEFLOW_SERVICE_SECRET_PORTFOLIO: ${TRADEFLOW_SERVICE_SECRET_PORTFOLIO:-local-dev-only-portfolio-client-secret}
      TRADEFLOW_SERVICE_SECRET_LIVE: ${TRADEFLOW_SERVICE_SECRET_LIVE:-local-dev-only-live-trading-client-secret}
      TRADEFLOW_DEMO_ENABLED: ${TRADEFLOW_DEMO_ENABLED:-true}
      TRADEFLOW_DEMO_PASSWORD: ${TRADEFLOW_DEMO_PASSWORD:-Demo@12345}
    healthcheck: *app-health

  market-data-service:
    profiles: ["apps", "demo", "academy"]
    # Come back after a Docker Desktop restart, and give Spring time to finish in-flight
    # work and leave its Kafka groups before Docker escalates SIGTERM to SIGKILL (exit 137).
    restart: unless-stopped
    stop_grace_period: 30s
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: market-data-service } }
    image: tradeflow/market-data-service:local
    mem_limit: 448m
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
    # MARKET_DATA_REPLICAS=2 demonstrates load balancing (gateway and Feign calls alternate between
    # them; see X-Served-By). Safe: outbox rows are claimed with SKIP LOCKED and only one
    # simulated tick is generated per interval across replicas.
    deploy:
      replicas: ${MARKET_DATA_REPLICAS:-1}
    depends_on: *service-depends
    environment:
      <<: *service-env
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_market_data
      TRADEFLOW_MARKET_TICK_MS: ${TRADEFLOW_MARKET_TICK_MS:-30000}
    healthcheck: *app-health

  order-service:
    profiles: ["apps", "demo", "academy"]
    # Come back after a Docker Desktop restart, and give Spring time to finish in-flight
    # work and leave its Kafka groups before Docker escalates SIGTERM to SIGKILL (exit 137).
    restart: unless-stopped
    stop_grace_period: 30s
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: order-service } }
    image: tradeflow/order-service:local
    mem_limit: 448m
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
    depends_on:
      <<: *service-depends
      market-data-service:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_order
      JAVA_OPTS: -Xmx192m
    healthcheck: *app-health

  portfolio-service:
    profiles: ["apps", "demo", "academy"]
    # Come back after a Docker Desktop restart, and give Spring time to finish in-flight
    # work and leave its Kafka groups before Docker escalates SIGTERM to SIGKILL (exit 137).
    restart: unless-stopped
    stop_grace_period: 30s
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: portfolio-service } }
    image: tradeflow/portfolio-service:local
    mem_limit: 448m
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
    depends_on:
      <<: *service-depends
      market-data-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_portfolio
      JAVA_OPTS: -Xmx192m
      TRADEFLOW_SERVICE_SECRET_PORTFOLIO: ${TRADEFLOW_SERVICE_SECRET_PORTFOLIO:-local-dev-only-portfolio-client-secret}
      TRADEFLOW_AI_PROVIDER: ${TRADEFLOW_AI_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck: *app-health

  learning-service:
    profiles: ["apps", "academy"]
    # Come back after a Docker Desktop restart, and give Spring time to finish in-flight
    # work and leave its Kafka groups before Docker escalates SIGTERM to SIGKILL (exit 137).
    restart: unless-stopped
    stop_grace_period: 30s
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: learning-service } }
    image: tradeflow/learning-service:local
    mem_limit: 448m
    depends_on:
      <<: *service-depends
      db-init:
        condition: service_completed_successfully
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
    environment:
      <<: *service-env
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_learning
    healthcheck: *app-health

  # LIVE trading (real money). Own database and own encryption keys. Broker: "none" by default;
  # "fyers" (read-only, phase 6) when TRADEFLOW_LIVE_BROKER=fyers and the Fyers app credentials are
  # set in the git-ignored .env (see docs/FYERS_SETUP.md). Without them the service refuses to start.
  live-trading-service:
    profiles: ["apps"]
    # Come back after a Docker Desktop restart, and give Spring time to finish in-flight
    # work and leave its Kafka groups before Docker escalates SIGTERM to SIGKILL (exit 137).
    restart: unless-stopped
    stop_grace_period: 30s
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: live-trading-service } }
    image: tradeflow/live-trading-service:local
    mem_limit: 448m
    depends_on:
      <<: *service-depends
      db-init:
        condition: service_completed_successfully
    volumes:
      - jwt_public:/run/tradeflow/jwt-public:ro
      - live_data_keys:/run/tradeflow/data-keys:ro
    environment:
      <<: *service-env
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradeflow_live
      TRADEFLOW_LIVE_DATA_KEYRING: file:/run/tradeflow/data-keys/data-keys.properties
      TRADEFLOW_SERVICE_SECRET_LIVE: ${TRADEFLOW_SERVICE_SECRET_LIVE:-local-dev-only-live-trading-client-secret}
      TRADEFLOW_LIVE_BROKER: ${TRADEFLOW_LIVE_BROKER:-none}
      TRADEFLOW_FYERS_APP_ID: ${TRADEFLOW_FYERS_APP_ID:-}
      TRADEFLOW_FYERS_SECRET_KEY: ${TRADEFLOW_FYERS_SECRET_KEY:-}
      TRADEFLOW_FYERS_REDIRECT_URI: ${TRADEFLOW_FYERS_REDIRECT_URI:-http://localhost:3000/live/broker/callback}
    healthcheck: *app-health

volumes:
  postgres_data:
  kafka_data:
  # Key material (see keygen). Deleting jwt_private/jwt_public signs everyone out;
  # deleting user_data_keys makes stored TOTP seeds unreadable (users must re-enrol);
  # deleting live_data_keys makes stored broker tokens unreadable (users must reconnect).
  jwt_private:
  jwt_public:
  prometheus_data:
  grafana_data:
  user_data_keys:
  live_data_keys:
