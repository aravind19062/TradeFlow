spring.application.name=tradeflow-market-data-service
server.port=${SERVER_PORT:8083}

# ---------------------------------------------------------------------------
# Database: PostgreSQL from docker compose by default.
# Any key can be overridden with an environment variable via Spring relaxed
# binding, e.g. SPRING_DATASOURCE_URL. Inside compose the host is 'postgres'.
# No Docker? Run with SPRING_PROFILES_ACTIVE=h2 (file-based H2, see application-h2.properties).
# The default credentials only match the throwaway local compose container.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/tradeflow_market_data
spring.datasource.username=${TRADEFLOW_DB_USERNAME:tradeflow}
spring.datasource.password=${TRADEFLOW_DB_PASSWORD:tradeflow}

# Schema is owned by Flyway; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/market

# ---------------------------------------------------------------------------
# Kafka: compose exposes the broker to the host on 9094 (9092 is often taken by
# a Homebrew Kafka). Containers use kafka:29092 via KAFKA_BOOTSTRAP_SERVERS.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.admin.fail-fast=false

# ---------------------------------------------------------------------------
# Security: HS256 JWTs issued by tradeflow-user-service.
# The default is a public, local-only placeholder. Set TRADEFLOW_JWT_SECRET
# (same value in every service) anywhere else.
# ---------------------------------------------------------------------------
tradeflow.security.jwt.secret=${TRADEFLOW_JWT_SECRET:local-dev-only-insecure-jwt-secret-do-not-use-in-prod}
tradeflow.security.jwt.issuer=tradeflow-user-service

# Actuator / OpenAPI
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

logging.pattern.level=%5p [%X{requestId:-}%X{eventId:-}]

# Simulated market. Same seed => same prices on every machine. NOT live market data.
tradeflow.market.seed=${TRADEFLOW_MARKET_SEED:42}
tradeflow.market.history-ticks=90
tradeflow.market.history-spacing=P1D
tradeflow.market.simulation.enabled=${TRADEFLOW_MARKET_TICKING:true}
tradeflow.market.simulation.tick-interval-ms=${TRADEFLOW_MARKET_TICK_MS:30000}
