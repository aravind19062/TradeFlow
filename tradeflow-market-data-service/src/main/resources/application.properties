spring.application.name=tradeflow-market-data-service

# H2 in-memory database (data resets every time the app restarts)
spring.datasource.url=jdbc:h2:mem:tradeflow_market_data
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create/update tables from your JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console, browsable at http://localhost:8083/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8083