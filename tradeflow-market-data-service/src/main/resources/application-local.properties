# LOCAL DEVELOPMENT ONLY (activated explicitly with SPRING_PROFILES_ACTIVE=local,
# automatically by the 'h2' profile, and by docker-compose for the local stack).
# Verifies tokens with the per-machine public key from `make keys` (Docker mounts it instead).
# Never activate this profile on a shared or internet-facing environment.
tradeflow.security.jwt.public-keys=${TRADEFLOW_JWT_PUBLIC_KEYS:file:.secrets/jwt/public/*.pem}
