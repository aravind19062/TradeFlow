spring.application.name=tradeflow-portfolio-service
# The no-Docker 'h2' profile is a local-development profile too.
spring.profiles.group.h2=local
# Trust X-Forwarded-* only from private-network proxies (the gateway).
server.forward-headers-strategy=native
server.port=${SERVER_PORT:8082}

# ---------------------------------------------------------------------------
# Database: PostgreSQL from docker compose by default.
# Any key can be overridden with an environment variable via Spring relaxed
# binding, e.g. SPRING_DATASOURCE_URL. Inside compose the host is 'postgres'.
# No Docker? Run with SPRING_PROFILES_ACTIVE=h2 (file-based H2, see application-h2.properties).
# The default credentials only match the throwaway local compose container.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/tradeflow_portfolio
spring.datasource.username=${TRADEFLOW_DB_USERNAME:tradeflow}
spring.datasource.password=${TRADEFLOW_DB_PASSWORD:tradeflow}

# Schema is owned by Flyway; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/portfolio

# ---------------------------------------------------------------------------
# Kafka: compose exposes the broker to the host on 9094 (9092 is often taken by
# a Homebrew Kafka). Containers use kafka:29092 via KAFKA_BOOTSTRAP_SERVERS.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.admin.fail-fast=false

# ---------------------------------------------------------------------------
# Security: HS256 JWTs issued by tradeflow-user-service.
# No default: TRADEFLOW_JWT_SECRET (>= 32 bytes, same value in every service) is
# required. Only the 'local' profile (application-local.properties) supplies a
# public development placeholder; the service refuses to start with that
# placeholder under any other profile.
# ---------------------------------------------------------------------------
tradeflow.security.jwt.secret=${TRADEFLOW_JWT_SECRET:}
tradeflow.security.jwt.issuer=tradeflow-user-service

# Actuator / OpenAPI
management.endpoints.web.exposure.include=health,info,metrics
# Anonymous callers see only UP/DOWN; component details need an ADMIN token.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

logging.pattern.level=%5p [%X{requestId:-}%X{eventId:-}]

# DEMO: simulated starting cash for every new account (INR).
tradeflow.portfolio.initial-cash=${TRADEFLOW_INITIAL_CASH:1000000.00}
tradeflow.portfolio.currency=INR
tradeflow.portfolio.reconciliation-interval-ms=60000

# AI portfolio assistant. 'none' = deterministic answers only, no external calls.
# 'anthropic' = Claude via the Anthropic API; requires ANTHROPIC_API_KEY (never commit it).
tradeflow.ai.provider=${TRADEFLOW_AI_PROVIDER:none}
tradeflow.ai.api-key=${ANTHROPIC_API_KEY:}
tradeflow.ai.model=${TRADEFLOW_AI_MODEL:claude-opus-5-5}
tradeflow.ai.max-tokens=8000
tradeflow.ai.request-timeout=PT30S
tradeflow.ai.overall-deadline=PT60S
tradeflow.ai.max-tool-rounds=4
tradeflow.ai.max-questions-per-hour=30
# Cross-service reconciliation: reservations still ACTIVE after this are checked against order-service.
tradeflow.portfolio.cross-check-stale-after=PT5M
tradeflow.portfolio.cross-check-interval-ms=120000

# Admin endpoints of this service (dead-letter tools etc.) live under this prefix; the gateway routes it here.
tradeflow.admin.path=/api/admin/portfolio

# ---------------------------------------------------------------------------
# Service discovery (Eureka). Registered = alive (heart-beating); it does NOT
# mean ready. Callers' load balancers additionally poll /actuator/health/readiness.
# ---------------------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
# Readiness = started + database reachable. Kafka is excluded on purpose: the outbox
# keeps accepting work while Kafka is down. Used by Docker and the load balancers.
management.endpoint.health.group.readiness.include=readinessState,db

# ---------------------------------------------------------------------------
# Synchronous calls (OpenFeign) to other services, resolved via Eureka.
#  - timeouts: connect 2 s, read 5 s
#  - circuit breaker per client method: opens at 50% failures of the last 20 calls
#    (min 10), probes again after 15 s; 4xx answers are not failures
#  - load balancer: round robin over instances whose readiness check passes;
#    one retry on ANOTHER instance, only for GET (never for non-idempotent calls)
# ---------------------------------------------------------------------------
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
# No thread pool either: breaker-protected calls run on the request thread, so the
# caller's security context (JWT relay) and MDC request id are preserved
# (verified by FeignTokenRelayTest: with a thread pool the relayed token is lost).
spring.cloud.circuitbreaker.resilience4j.disable-thread-pool=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=feign.FeignException$FeignClientException
spring.cloud.loadbalancer.retry.enabled=true
spring.cloud.loadbalancer.retry.retry-on-all-operations=false
spring.cloud.loadbalancer.retry.max-retries-on-same-service-instance=0
spring.cloud.loadbalancer.retry.max-retries-on-next-service-instance=1
spring.cloud.loadbalancer.health-check.path.default=/actuator/health/readiness
spring.cloud.loadbalancer.health-check.interval=10s
spring.cloud.loadbalancer.health-check.refetch-instances=true
spring.cloud.loadbalancer.health-check.refetch-instances-interval=10s
